<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Календарь</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="calendarUtils.js"></script>
</head>

<body>
    <div id="navbar-container"></div>
    <div class="container">
        <h2>Мои календари</h2>

        <input type="text" id="calendarName" placeholder="Название календаря">
        <button onclick="createCalendar()">Создать календарь</button>

        <h3>Список календарей:</h3>
        <div id="calendars"></div>
        <script>
            window.addEventListener("DOMContentLoaded", () => {
                loadCalendars("calendars"); // передаём ID контейнера
            });
        </script>

        <h3>Добавить участника:</h3>
        <input type="text" id="participantEmail" placeholder="Email пользователя">
        <select id="participantRole">
            <option value="view">Только просмотр</option>
            <option value="edit">Редактирование</option>
        </select>
        <input type="text" id="calendarIdInput" placeholder="ID календаря">
        <button onclick="addParticipant()">Добавить участника</button>
        <div id="participantMessage"></div>

        <h3>События календаря:</h3>
        <input type="date" id="date">
        <input type="text" id="text" placeholder="Заметка">
        <button onclick="addEvent()">Добавить событие</button>
        <div id="events"></div>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">✖</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script>

        async function loadEvents() {
            const calendarId = localStorage.getItem("currentCalendarId");

            console.log("calendarId:", calendarId);

            if (!calendarId) {
                console.log("❌ нет календаря");
                return;
            }
            const res = await fetch("/events?calendarId=" + calendarId);
            const events = await res.json();

            const container = document.getElementById("events");
            container.innerHTML = "";
            events.forEach(event => { 
                const div = document.createElement("div");
                div.className = "event-card";
                div.innerHTML = `
                    <b>${event.date}</b> ${new Date(event.createdAt).toLocaleTimeString()}<br>
                    <div class="owner">Владелец: ${event.ownerId?.email || "не указан"}</div>
                    <div class="participants">Участники: ${event.participants?.map(p => p.userId?.email || p.userId).join(", ") || "-"}</div>
                    <div class="text">${event.text}</div>
                `;
                container.appendChild(div);
            });
        }

        async function addEvent() {
            const date = document.getElementById("date").value;
            const text = document.getElementById("text").value;
            if (!date || !text) return alert("Введите дату и текст");
            if (!calendarId) return alert("Сначала выбери календарь");

            await fetch("/events", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ calendarId, date, text })
            });

            document.getElementById("text").value = "";
            socket.emit("newEvent", { calendarId, date, text });
            loadEvents();
        }

        socket.on("receiveEvent", loadEvents);
        window.addEventListener("DOMContentLoaded", () => {
            loadCalendars("calendars");
        });
    </script>
</body>

</html>
