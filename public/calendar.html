<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Мои календари</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <h2>Мои календари</h2>

    <!-- Создание календаря -->
    <input type="text" id="calendarName" placeholder="Название календаря">
    <button onclick="createCalendar()">Создать календарь</button>

    <h3>Список календарей:</h3>
    <div id="calendars"></div>

    <h3>Добавить участника:</h3>
    <input type="text" id="participantEmail" placeholder="Email пользователя">
    <select id="participantRole">
        <option value="view">Только просмотр</option>
        <option value="edit">Редактирование</option>
    </select>
    <input type="text" id="calendarIdInput" placeholder="ID календаря">
    <button onclick="addParticipant()">Добавить участника</button>
    <div id="participantMessage"></div>

    <h3>События календаря:</h3>
    <input type="date" id="date">
    <input type="text" id="text" placeholder="Заметка">
    <button onclick="addEvent()">Добавить событие</button>
    <div id="events"></div>

    <script>
        const socket = io();

        // получаем ID текущего календаря
        const calendarId = localStorage.getItem("currentCalendarId");

        // подключаемся к комнате календаря
        if (calendarId) socket.emit("joinCalendar", calendarId);

        // создание события
        async function addEvent() {
            const date = document.getElementById("date").value;
            const text = document.getElementById("text").value;
            if (!date || !text) return alert("Введите дату и текст");

            const event = { calendarId, date, text };

            await fetch("/events", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(event)
            });

            document.getElementById("text").value = "";
            socket.emit("newEvent", event);
        }

        // получение новых событий в реальном времени
        socket.on("receiveEvent", (event) => {
            addEventCard(event);
        });

        function addEventCard(event) {
            const container = document.getElementById("events");
            const div = document.createElement("div");
            div.className = "event-card";
            div.innerHTML = `
            <b>${event.date}</b>: ${event.text}
            <div class="owner">Владелец: ${event.owner || "не указан"}</div>
            <div class="participants">Участники: ${event.participants ? event.participants.join(", ") : "-"}</div>
        `;
            container.appendChild(div);
        }

        // загрузка календарей пользователя
        async function loadCalendars() {
            const userId = localStorage.getItem("userId");
            if (!userId) return alert("Ошибка: userId не найден. Войдите снова.");

            const res = await fetch("/calendars/" + userId);
            const data = await res.json();
            const container = document.getElementById("calendars");
            container.innerHTML = "";

            data.forEach(cal => {
                const card = document.createElement("div");
                card.className = "calendar-card";
                card.innerHTML = `<b>${cal.name}</b> (id: ${cal._id})`;

                // клик по календарю — выбираем его
                card.onclick = () => {
                    localStorage.setItem("currentCalendarId", cal._id);
                    alert(`Выбрали календарь "${cal.name}"`);
                    socket.emit("joinCalendar", cal._id);
                };

                // подсказка по участникам
                card.onmouseenter = () => {
                    const participants = cal.participants.map(p => p.userId).join(", ");
                    card.title = `Участники: ${participants}\nВладелец: ${cal.ownerId}`;
                };

                container.appendChild(card);
            });
        }

        async function createCalendar() {
            const name = document.getElementById("calendarName").value;
            if (!name) return alert("Введите название календаря");

            const userId = localStorage.getItem("userId");
            if (!userId) return alert("Ошибка: userId не найден. Войдите снова.");

            const res = await fetch("/calendars", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, ownerId: userId })
            });

            document.getElementById("calendarName").value = "";
            loadCalendars();
        }

        async function addParticipant() {
            const email = document.getElementById("participantEmail").value;
            const role = document.getElementById("participantRole").value;
            const calendarId = document.getElementById("calendarIdInput").value;

            if (!email || !calendarId) return alert("Введите email и ID календаря");

            const res = await fetch(`/calendars/${calendarId}/add-participant`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, role })
            });

            const data = await res.json();
            document.getElementById("participantMessage").innerText = data.message;
            loadCalendars();
        }

        loadCalendars();
    </script>
</body>

</html>
