<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои календари</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="calendarUtils.js"></script>
</head>
<body>

    <div id="navbar-container"></div>
    <div class="container">
        <h2>Мои календари</h2>

        <input type="text" id="calendarName" placeholder="Название календаря">
        <button onclick="createCalendar()">Создать календарь</button>

        <h3>Список календарей:</h3>
        <div id="calendars-container" class="calendars-grid"></div>
    </div>
    <script src="navbar.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            loadCalendars("calendars-container");
        });
    </script>
</body>
</html>
